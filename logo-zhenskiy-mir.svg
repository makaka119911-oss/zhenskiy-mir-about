<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- фирменный градиент -->
    <linearGradient id="bord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5c68"/>
      <stop offset="1" stop-color="#5c3a4f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b380"/>
      <stop offset="1" stop-color="#b28a57"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0dbe0"/>
      <stop offset="1" stop-color="#d9b2bb"/>
    </linearGradient>
  </defs>

  <!-- мягко-фоновое сияние (не прямой фон, а подсветка) -->
  <circle cx="256" cy="256" r="180" fill="url(#rose)" opacity="0.25"/>
  <circle cx="256" cy="256" r="140" fill="url(#rose)" opacity="0.3"/>

  <!-- цветок «Женского мира»: 8 нежных лепестков-стека вокруг центра -->
  <g transform="translate(256,256)">
    <!-- внешние лепестки (бордово-розовые) -->
    <g opacity="0.92">
      <path d="M0,-18 C-6,-46 -34,-62 -58,-58 C-46,-78 -22,-78 -2,-62 C-6,-46 0,-30 0,-18 Z" fill="url(#bord)" transform="rotate(0)"/>
      <path d="M0,-18 C-6,-46 -34,-62 -58,-58 C-46,-78 -22,-78 -2,-62 C-6,-46 0,-30 0,-18 Z" fill="url(#bord)" transform="rotate(45)"/>
      <path d="M0,-18 C-6,-46 -34,-62 -58,-58 C-46,-78 -22,-78 -2,-62 C-6,-46 0,-30 0,-18 Z" fill="url(#bord)" transform="rotate(90)"/>
      <path d="M0,-18 C-6,-46 -34,-62 -58,-58 C-46,-78 -22,-78 -2,-62 C-6,-46 0,-30 0,-18 Z" fill="url(#bord)" transform="rotate(135)"/>
      <path d="M0,-18 C-6,-46 -34,-62 -58,-58 C-46,-78 -22,-78 -2,-62 C-6,-46 0,-30 0,-18 Z" fill="url(#bord)" transform="rotate(180)"/>
      <path d="M0,-18 C-6,-46 -34,-62 -58,-58 C-46,-78 -22,-78 -2,-62 C-6,-46 0,-30 0,-18 Z" fill="url(#bord)" transform="rotate(225)"/>
      <path d="M0,-18 C-6,-46 -34,-62 -58,-58 C-46,-78 -22,-78 -2,-62 C-6,-46 0,-30 0,-18 Z" fill="url(#bord)" transform="rotate(270)"/>
      <path d="M0,-18 C-6,-46 -34,-62 -58,-58 C-46,-78 -22,-78 -2,-62 C-6,-46 0,-30 0,-18 Z" fill="url(#bord)" transform="rotate(315)"/>
    </g>
    <!-- внутренние лепестки золотисто-розовые, мягче -->
    <g opacity="0.95">
      <path d="M0,-8 C-4,-34 -24,-46 -42,-44 C-34,-58 -16,-56 -2,-44 C-4,-34 0,-20 0,-8 Z" fill="url(#gold)" transform="rotate(22.5)"/>
      <path d="M0,-8 C-4,-34 -24,-46 -42,-44 C-34,-58 -16,-56 -2,-44 C-4,-34 0,-20 0,-8 Z" fill="url(#gold)" transform="rotate(67.5)"/>
      <path d="M0,-8 C-4,-34 -24,-46 -42,-44 C-34,-58 -16,-56 -2,-44 C-4,-34 0,-20 0,-8 Z" fill="url(#gold)" transform="rotate(112.5)"/>
      <path d="M0,-8 C-4,-34 -24,-46 -42,-44 C-34,-58 -16,-56 -2,-44 C-4,-34 0,-20 0,-8 Z" fill="url(#gold)" transform="rotate(157.5)"/>
      <path d="M0,-8 C-4,-34 -24,-46 -42,-44 C-34,-58 -16,-56 -2,-44 C-4,-34 0,-20 0,-8 Z" fill="url(#gold)" transform="rotate(202.5)"/>
      <path d="M0,-8 C-4,-34 -24,-46 -42,-44 C-34,-58 -16,-56 -2,-44 C-4,-34 0,-20 0,-8 Z" fill="url(#gold)" transform="rotate(247.5)"/>
      <path d="M0,-8 C-4,-34 -24,-46 -42,-44 C-34,-58 -16,-56 -2,-44 C-4,-34 0,-20 0,-8 Z" fill="url(#gold)" transform="rotate(292.5)"/>
      <path d="M0,-8 C-4,-34 -24,-46 -42,-44 C-34,-58 -16,-56 -2,-44 C-4,-34 0,-20 0,-8 Z" fill="url(#gold)" transform="rotate(337.5)"/>
    </g>
    <!-- центр (золотая сердцевина-капля) -->
    <circle cx="0" cy="0" r="26" fill="url(#gold)" opacity="0.95"/>
    <circle cx="0" cy="-5" r="15" fill="url(#bord)" opacity="0.85"/>
    <circle cx="-2" cy="-3" r="5" fill="#f0dbe0" opacity="0.9"/>
  </g>
</svg>
